<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>NAMI Thurston-Mason</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <h1>Welcome</h1>

    <p>
      Find local support, programs, 
      and resources for Thurston and Mason Counties.
    </p>

    <ion-card>
      <ion-card-header>
        <ion-card-title>Find Local Support</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <p>
          Find local NAMI contant, office, and location information.
        </p>

        <ion-button routerLink="/local-support">
          Find Support
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Blank</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <strong>Ready to create an app?</strong>
    <p>Start with Ionic <a target="_blank" rel="noopener noreferrer" href="https://ionicframework.com/docs/components">UI Components</a></p>
  </div>
</ion-content>
